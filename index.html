<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Pineapple Bio-Leather</title>
    <!-- Importing Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            /* Professional Radial Gradient Background */
            background: radial-gradient(circle at center, #3d7532 0%, #2e5a27 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* Subtle organic background pattern overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.05;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 30c0-15 15-30 15-30s15 15 15 30-15 30-15 30-15-15-15-30zm-30 0c0-15 15-30 15-30s15 15 15 30-15 30-15 30-15-15-15-30z' fill='%23ffffff' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .welcome-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1; /* Keeps content above pattern */
            animation: fadeIn 1.5s ease-out;
        }

        .enter-img {
            width: 85%;
            max-width: 500px;
            border-radius: 25px;
            /* Multi-layered shadow for depth */
            box-shadow: 0 20px 50px rgba(0,0,0,0.4), 
                        0 0 0 5px rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            margin-bottom: 25px;
        }

        .enter-img:hover {
            transform: scale(1.05) translateY(-10px);
            box-shadow: 0 30px 60px rgba(139, 195, 74, 0.4);
        }

        .welcome-text {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            font-size: 1.1rem;
            margin: 0;
            opacity: 0.9;
        }

        .instruction-text {
            font-weight: 300;
            font-size: 0.9rem;
            margin-top: 10px;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        /* Animation for entrance */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Gentle pulse for the instruction */
        .pulse {
            animation: pulse-slow 3s infinite ease-in-out;
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <!-- CLICKABLE PICTURE -->
        <a href="home.html">
            <img src="leather-graphic.jpg" class="enter-img" alt="Click to Enter Website">
        </a>

        <p class="welcome-text">Pineapple Bio-Leather</p>
        <p class="instruction-text pulse">Click image to explore the project</p>
    </div>

</body>
</html>
